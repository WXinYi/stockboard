name: Release 数据库初始化/重建
# 一次性迁移工具: 把 crawl_data.db 上传到 Release 三层存储(热层 db-state + 已完成月冷层)。
# 库文件优先从热层恢复, 热层不存在时从 git 历史最后一次 db 提交检出(迁移期专用)。
# 日常增量由 crawl.yml 收盘后 --sync 维护, 本工作流只在初始化/重建时手动或编辑触发。

on:
  workflow_dispatch:
  push:               # 编辑本文件即触发一次重建(幂等), 便于首次迁移无需手动点
    paths: [.github/workflows/db_upload.yml]

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需从 git 历史检出最后一次 db 提交(浅克隆查不到)

      - name: 恢复库文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 匿名读会被限流, 见 crawl.yml 同名步骤
        run: |
          # 注意: git 命令必须在仓库根目录执行(pathspec 相对 cwd)
          SHA=$(git rev-list HEAD -- jiarenmens/data/crawl_data.db | \
            while read s; do git cat-file -e "$s:jiarenmens/data/crawl_data.db" 2>/dev/null && echo "$s" && break; done)
          if [ -n "$SHA" ]; then
            git checkout "$SHA" -- jiarenmens/data/crawl_data.db
            echo "✅ 已从历史提交 $SHA 恢复"
          fi
          cd jiarenmens
          if python3 scripts/release_db.py --download-latest; then
            echo "✅ 已从热层覆盖恢复"
          else
            # 2026-09-15 静默审计 S5: 原写法把"下载失败"和"热层不存在"合成一个 elif 分支,
            # 瞬时故障(限流/抖动)时会用 git 历史的旧库 --init 覆盖掉更新的热层(绿灯数据回滚)。
            # 这里先探测热层是否真的不存在, 只有确认 absent 才允许用 git 历史库兜底。
            HOT=$(python3 scripts/release_db.py --hot-status | sed -n 's/^hot_status\[crawl\]: //p' | tail -1)
            if [ "$HOT" = "absent" ] && [ -f data/crawl_data.db ]; then
              echo "ℹ️ 热层确实不存在(hot_status=absent), 使用 git 历史恢复的库做首次初始化"
            elif [ "$HOT" = "absent" ]; then
              echo "❌ 热层与 git 历史均无法恢复库文件"; exit 1
            else
              echo "❌ 热层状态=$HOT: 下载失败或读取受限, 拒绝用 git 历史旧库覆盖热层"; exit 1
            fi
          fi

      - name: 上传 Release 存储
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 jiarenmens/scripts/release_db.py --init
# re-trigger: release_db.py 匿名读修复


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [init]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
