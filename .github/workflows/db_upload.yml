name: Release 数据库初始化/重建
# 一次性迁移工具: 把 crawl_data.db 上传到 Release 三层存储(热层 db-state + 已完成月冷层)。
# 库文件优先从热层恢复, 热层不存在时从 git 历史最后一次 db 提交检出(迁移期专用)。
# 日常增量由 crawl.yml 收盘后 --sync 维护, 本工作流只在初始化/重建时手动或编辑触发。

on:
  workflow_dispatch:
  push:               # 编辑本文件即触发一次重建(幂等), 便于首次迁移无需手动点
    paths: [.github/workflows/db_upload.yml]

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需从 git 历史检出最后一次 db 提交(浅克隆查不到)

      - name: 恢复库文件
        run: |
          # 注意: git 命令必须在仓库根目录执行(pathspec 相对 cwd)
          SHA=$(git rev-list HEAD -- jiarenmens/data/crawl_data.db | \
            while read s; do git cat-file -e "$s:jiarenmens/data/crawl_data.db" 2>/dev/null && echo "$s" && break; done)
          if [ -n "$SHA" ]; then
            git checkout "$SHA" -- jiarenmens/data/crawl_data.db
            echo "✅ 已从历史提交 $SHA 恢复"
          fi
          cd jiarenmens
          if python3 scripts/release_db.py --download-latest; then
            echo "✅ 已从热层覆盖恢复"
          elif [ -f data/crawl_data.db ]; then
            echo "ℹ️ 热层不存在, 使用 git 历史恢复的库"
          else
            echo "❌ 热层与 git 历史均无法恢复库文件"; exit 1
          fi

      - name: 上传 Release 存储
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 jiarenmens/scripts/release_db.py --init
# re-trigger: release_db.py 匿名读修复
