# KPL 中转 SCF 自动部署 — push scf/ 目录时部署到腾讯云函数(国内直连)
# 函数 URL 方式(API 网关已停售), 幂等脚本: 创建/更新函数 + 创建函数 URL
# 需要仓库 secrets: TENCENT_SECRET_ID + TENCENT_SECRET_KEY(CAM API 密钥)
name: deploy-scf

on:
  push:
    branches: [main]
    paths: ['scf/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tencent SCF SDK
        working-directory: scf
        run: npm i --no-audit --no-fund

      - name: Deploy KPL proxy to Tencent SCF
        working-directory: scf
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node deploy.mjs


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
