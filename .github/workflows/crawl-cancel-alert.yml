name: 采集掐班告警
# 2026-11-17: GitHub 原生 schedule 连续多次延迟到次日凌晨(最新 11-17 01:28),
# 告警变成“半夜报昨日旧账”。改为 cron-job.org 在北京 15:45 触发
# repository_dispatch: crawl-cancel-check; 脚本再做北京时间窗口保护。
# 只统计 cron-job.org 定时采集班，不统计 push / 普通手动补跑。
# 已告警 run id 落 .github/state/crawl-cancel-alert.json 防重复推送。

on:
  repository_dispatch:
    types: [crawl-cancel-check]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印不发送钉钉、不写去重状态(演练用)'
        type: boolean
        default: false
      force_window:
        description: '忽略北京时间 15:40-16:30 窗口(补发用)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: cancel-alert-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 检查当日定时采集班是否被掐
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/crawl_cancel_alert.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force_window && '--force-window' || '' }}
      - name: 提交告警去重状态
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/state/crawl-cancel-alert.json ]; then
            git add .github/state/crawl-cancel-alert.json
          fi
          if git diff --cached --quiet; then
            echo "无新增告警状态"
            exit 0
          fi
          git commit -m "chore(alert): 更新掐班告警去重状态 [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "✅ 告警状态已提交"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "⚠️ 告警状态推送失败，重试 $i/3..."
            sleep 5
          done
          echo "❌ 告警状态推送失败"; exit 1

  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
