name: 竞价扫描 + 推送
# 由 cron-job.org 09:25(北京时间) repository_dispatch 触发。
# 只扫描 + 推送, 不构建前端不部署 Pages(Pages 部署 2-3 分钟赶不上 09:30)。

on:
  repository_dispatch:
    types: [auction]
  workflow_dispatch:  # 手动触发(验证用)

concurrency:
  group: auction-scan
  cancel-in-progress: true

jobs:
  auction:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 竞价扫描 + 钉钉主结论(09:29 前)
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python scripts/auction_scan.py

      - name: 提交 auction.json + auction.db(前端 raw 即时读取 + 回测积累)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f stockboard-app/public/data/latest/auction.json jiarenmens/data/auction.db
          if git diff --staged --quiet; then
            echo "auction.json 无变化, 跳过提交"
          else
            git commit -m "🎯 竞价扫描 $(date +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "✅ 推送成功"
                exit 0
              fi
              echo "⚠️ 推送失败, 重试 $i/3..."
              sleep 5
            done
            echo "❌ 推送失败"; exit 1
          fi

      - name: 等至 09:31 开盘确认
        run: |
          python3 - <<'EOF'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          target = now.replace(hour=9, minute=31, second=0)
          if (target - now).total_seconds() > 0:
              print(f"⏳ sleep {int((target - now).total_seconds())}s 至 09:31")
              time.sleep((target - now).total_seconds())
          else:
              print("已过 09:31, 直接确认")
          EOF

      - name: E 层开盘确认 + 钉钉补推
        if: always()
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python scripts/auction_scan.py --confirm --candidates /tmp/auction_candidates.json || true
