name: 竞价扫描 + 推送
# 由 cron-job.org 09:25(北京时间) repository_dispatch 触发。
# 只扫描 + 推送, 不构建前端不部署 Pages(Pages 部署 2-3 分钟赶不上 09:30)。

on:
  repository_dispatch:
    types: [auction]
  workflow_dispatch:  # 手动触发(验证用)

concurrency:
  group: auction-scan
  cancel-in-progress: true

jobs:
  auction:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # auction.db 恢复(Release 迁移): 扫描写库前必恢复; Release 失败回退日期快照→git 内库过渡
      - name: 下载 auction.db 热层
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          elif [ -f data/auction.db ]; then
            echo "⚠️ auction 热层不可用(迁移过渡期), 使用 git 内 db 继续"
          else
            echo "❌ auction.db 恢复失败且本地无库, 终止防数据断链"; exit 1
          fi
          sha256sum data/auction.db | awk '{print $1}' > /tmp/auction_sha_start

      # 竞价跟单快报(09:26, 先于扫描推): 13 名关注选手竞价阶段成交 + 持仓快照
      - name: 竞价跟单快报
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python scripts/watched_flash.py

      - name: 竞价扫描 + 钉钉主结论(09:29 前)
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python scripts/auction_scan.py

      # auction.db 上传闸门(Release 迁移): sha 变更才传; 竞价档案易逝, 失败即失败不吞
      - name: 上传 auction.db 热层
        run: |
          cd jiarenmens
          NOW=$(sha256sum data/auction.db | awk '{print $1}')
          if [ "$NOW" = "$(cat /tmp/auction_sha_start)" ]; then
            echo "auction.db 无变更, 跳过上传"
          else
            python3 scripts/release_db.py --what auction --upload-latest
          fi

      - name: 提交 auction.json + auction.db(前端 raw 即时读取 + 回测积累)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f stockboard-app/public/data/latest/auction.json jiarenmens/data/auction.db jiarenmens/data/hot_rank.db jiarenmens/data/player_visibility.json
          if git diff --staged --quiet; then
            echo "auction.json 无变化, 跳过提交"
          else
            git commit -m "🎯 竞价扫描 $(date +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "✅ 推送成功"
                exit 0
              fi
              echo "⚠️ 推送失败, 重试 $i/3..."
              sleep 5
            done
            echo "❌ 推送失败"; exit 1
          fi

      - name: 等至 09:31 开盘确认
        run: |
          python3 - <<'EOF'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          target = now.replace(hour=9, minute=31, second=0)
          if (target - now).total_seconds() > 0:
              print(f"⏳ sleep {int((target - now).total_seconds())}s 至 09:31")
              time.sleep((target - now).total_seconds())
          else:
              print("已过 09:31, 直接确认")
          EOF

      - name: E 层开盘确认 + 钉钉补推
        if: always()
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        # 修复 KeyError 后不再吞错: E 层失败应使 workflow 失败(可见), 且不影响已提交的 auction.db
        run: cd jiarenmens && python scripts/auction_scan.py --confirm --candidates /tmp/auction_candidates.json
