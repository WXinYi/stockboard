name: 竞价扫描 + 推送 + 发版
# 由 cron-job.org 09:25(北京时间) repository_dispatch 触发。
# 只扫描 + 推送 + 提交 auction.json, 然后直接 build+部署 Pages(不再等 09:31 开盘确认)。
# 2026-09-10 重构: 原「等至 09:31 开盘确认 + --confirm 补推」整链移除 —— 用户拍板
# 「不需要开盘确认了, 只要获取到新数据就直接发版」。这样竞价数据约 09:28 就上线,
# 不再搭 crawl 便车(09:32)晚 7 分钟(此前 09:25 推送后线上竞价页仍显示昨日数据)。

on:
  repository_dispatch:
    types: [auction]
  workflow_dispatch:  # 手动触发(验证用)

concurrency:
  group: auction-scan
  cancel-in-progress: true

jobs:
  auction:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # auction.db 恢复(Release 迁移): 扫描写库前必恢复; Release 失败回退日期快照→git 内库过渡
      - name: 下载 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          elif [ -f data/auction.db ]; then
            echo "⚠️ auction 热层不可用(迁移过渡期), 使用 git 内 db 继续"
          else
            echo "❌ auction.db 恢复失败且本地无库, 终止防数据断链"; exit 1
          fi
          sha256sum data/auction.db | awk '{print $1}' > /tmp/auction_sha_start

      # 竞价跟单快报(09:26, 先于扫描推): 13 名关注选手竞价阶段成交 + 持仓快照
      - name: 竞价跟单快报
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python scripts/watched_flash.py

      - name: 出击选股 + 昨日连板换手Top5 + 钉钉推送(09:29 前)
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 大模型独立选股(影子, src/analysis/llm_review.py): 缺失时脚本内静默跳过
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: deepseek-flash
        run: cd jiarenmens && python scripts/auction_scan.py

      # auction.db 上传闸门(Release 迁移): sha 变更才传; 竞价档案易逝, 失败即失败不吞
      - name: 上传 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          NOW=$(sha256sum data/auction.db | awk '{print $1}')
          if [ "$NOW" = "$(cat /tmp/auction_sha_start)" ]; then
            echo "auction.db 无变更, 跳过上传"
          else
            python3 scripts/release_db.py --what auction --upload-latest
          fi

      - name: 提交 auction.json + hot_rank.db(前端 raw 即时读取 + 回测积累)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f stockboard-app/public/data/latest/auction.json jiarenmens/data/hot_rank.db jiarenmens/data/player_visibility.json
          if git diff --staged --quiet; then
            echo "auction.json 无变化, 跳过提交"
          else
            git commit -m "🎯 竞价扫描 $(date +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "✅ 推送成功"
                exit 0
              fi
              echo "⚠️ 推送失败, 重试 $i/3..."
              sleep 5
            done
            echo "❌ 推送失败"; exit 1
          fi

      # 拿到数据直接发版: 复用 crawl 的 dist 壳缓存机制, 代码未变时 cache 命中则跳过 build,
      # 只 rsync 拼接最新 public/data(含刚生成的 auction.json) 到 dist。
      - name: 恢复 dist 壳
        id: dist
        uses: actions/cache@v4
        with:
          path: stockboard-app/dist
          key: dist-shell-${{ hashFiles('stockboard-app/src/**', 'stockboard-app/index.html', 'stockboard-app/vite.config.js', 'stockboard-app/package-lock.json') }}

      - name: Setup Node
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stockboard-app/package-lock.json

      - name: Build Vue
        if: steps.dist.outputs.cache-hit != 'true'
        run: cd stockboard-app && npm ci && npm run build

      - name: 拼接最新数据
        if: steps.dist.outputs.cache-hit == 'true'
        run: rsync -a --delete stockboard-app/public/data/ stockboard-app/dist/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stockboard-app/dist

  deploy:
    needs: auction
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4