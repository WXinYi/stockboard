name: 涨停池/炸板池历史回补(CI 一次性/手动)

# 背景(2026-09-09): 本地 keychain 凭据对 Release 只读(上传 404), 历史回补数据无法从本地推上
# auction-state 热层; CI 用 secrets.GITHUB_TOKEN 有写权限 → 由本 workflow 执行并上传。
#
# 触发:
#   1) 推送本文件/回补脚本(push paths)即自动跑一次(用于历史回补);
#   2) 之后可 workflow_dispatch 指定区间复用(幂等 INSERT OR REPLACE)。
# 口径: 历史日走 His(KPL_HIS_PROXY 中转), 当日走实时接口(见 backfill_emotion.py)。
# 两条回补互不依赖: limit_pool 按区间(自带幂等守卫, 已覆盖则跳过), 炸板池按最近 N 个交易日滚动窗口。

on:
  workflow_dispatch:
    inputs:
      start:
        description: '起始日 YYYY-MM-DD'
        required: false
        default: '2025-09-01'
      end:
        description: '结束日 YYYY-MM-DD(留空=今天)'
        required: false
        default: ''
      broken_days:
        description: '炸板池滚动窗口交易日数'
        required: false
        default: '30'
  push:
    paths:
      - '.github/workflows/backfill-pool-history.yml'
      - 'jiarenmens/scripts/backfill_emotion.py'
      - 'jiarenmens/scripts/backfill_broken.py'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      # His 域名对 Actions 出口 IP 风控, 走 SCF 中转(同 auction-label.yml)
      KPL_HIS_PROXY: https://1258166434-kgwxvgeu2h.ap-guangzhou.tencentscf.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: cd jiarenmens && pip install -r requirements.txt

      # ⚠️ 每次 push 到 main 也会触发 crawl.yml(它恢复→写宽度→上传 auction 热层)。
      # 若本任务与 crawl 并发, crawl 后上传会用"无回补"的库覆盖结果(2026-09-09 实测踩坑)。
      # 2026-09-15 静默审计: 原为固定 sleep 1200(盲等, 若那班 crawl 超过 20min 竞态照旧发生)。
      # 现改为轮询 crawl.yml 是否有进行中的班次, 等到确实没有为止(上限 40min, 超时告警但仍继续)。
      - name: 等待并发 crawl 完成(防热层后写覆盖)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            N=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl.yml/runs?status=in_progress" \
                 | python3 -c "import json,sys;print(json.load(sys.stdin).get('total_count',0))" 2>/dev/null || echo 0)
            if [ "$N" = "0" ]; then echo "✅ 无进行中的 crawl 班次, 继续"; exit 0; fi
            echo "⏳ 有 $N 个 crawl 班次进行中, 等待 60s ($i/40)"; sleep 60
          done
          echo "::warning::等待 crawl 超时(40min), 仍继续 — 存在热层后写覆盖风险, 请核对回补结果"

      - name: 恢复 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          else
            echo "❌ auction 热层恢复失败"; exit 1
          fi

      # 幂等守卫(2026-09-15 静默审计): 原先只看全局 MIN ≤ 2025-09-01 就跳过 ——
      # 指定更早区间的手动触发会被静默忽略("成功"但什么都没做)。现按请求起点判断。
      - name: 判断是否已回补(幂等守卫, 按请求区间)
        id: need
        env:
          INPUT_START: ${{ inputs.start }}
        run: |
          cd jiarenmens
          REQ="${INPUT_START:-2025-09-01}"
          MIN=$(python3 -c "import sqlite3;print(sqlite3.connect('data/auction.db').execute('SELECT MIN(date) FROM limit_pool').fetchone()[0])")
          echo "请求起点: $REQ | 当前 limit_pool 最早日期: $MIN"
          if [[ -n "$MIN" && ! "$MIN" > "$REQ" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "⏭ 请求起点 $REQ 已被覆盖(最早 $MIN), 跳过回补"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 历史回补(limit_pool 全字段)
        if: steps.need.outputs.skip == '0'
        env:
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          cd jiarenmens
          START="${INPUT_START:-2025-09-01}"
          END="${INPUT_END:-$(TZ=Asia/Shanghai date +%F)}"
          echo "回补区间: $START → $END"
          # --skip-existing: 已回补日期直接跳过(CI 恢复的热层里 7 月起已有数据);
          # --workers 8: 串行 1250 请求需 40-60min(经 SCF 中转), 并发后约 5min。
          python scripts/backfill_emotion.py --pool "$START" "$END" --workers 8 --skip-existing --retries 2 --retry-wait 30

      # 炸板池(选股宝源, 不经 His): 与上面的 limit_pool 回补互不依赖, 不套 limit_pool 的幂等守卫
      # (那个守卫只看 limit_pool 的 MIN, 已覆盖时会整段跳过, 那样炸板池永远补不上)。
      # 2026-09-17 起 crawl.yml 收盘班已改 7 天滚动窗口自愈; 这里用更长的窗口一次性补齐历史盲区。
      - name: 炸板池归档(滚动窗口重抓, 幂等自愈)
        id: broken
        env:
          INPUT_BROKEN_DAYS: ${{ inputs.broken_days }}
        run: |
          cd jiarenmens
          DAYS="${INPUT_BROKEN_DAYS:-30}"
          echo "炸板池滚动窗口: 最近 $DAYS 个交易日"
          python scripts/backfill_broken.py --days "$DAYS" --retries 2 --retry-wait 30
          python3 -c "
          import sqlite3
          c = sqlite3.connect('data/auction.db')
          mn, mx, n, d = c.execute('SELECT MIN(date), MAX(date), COUNT(*), COUNT(DISTINCT date) FROM broken_pool').fetchone()
          print(f'broken_pool: {mn} -> {mx}, {n} 行 / {d} 天')
          "

      - name: 上传 auction.db(热层 + 当日/当周快照)
        if: steps.need.outputs.skip == '0' || steps.broken.conclusion == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd jiarenmens && python3 scripts/release_db.py --what auction --upload-latest

      - name: 校验覆盖
        if: steps.need.outputs.skip == '0'
        run: |
          cd jiarenmens
          python3 -c "
          import sqlite3
          c = sqlite3.connect('data/auction.db')
          mn, mx, n = c.execute('SELECT MIN(date), MAX(date), COUNT(*) FROM limit_pool').fetchone()
          print(f'limit_pool: {mn} -> {mx}, {n} 行')
          assert mn <= '2025-09-01', f'回补未生效: MIN={mn}'
          print('✅ 回补覆盖校验通过')
          "
          PY


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [backfill]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
