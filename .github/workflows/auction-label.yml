name: 涨停池回补
# 收盘后(约 15:05, cron-job.org repository_dispatch / workflow_dispatch)触发。
# 原为"竞价结果标签"(candidates/candidate_results/v5_results 打标回测)——该存量体系
# 已于 2026-09-06 整链删除; 现职责为 backfill_emotion --pool 写 limit_pool 全字段
# (周期引擎/六情绪/出击选股的数据源), 修复当日涨停池断档。文件名与 dispatch type
# `label` 不变, cron-job.org 调度无需改动。

on:
  repository_dispatch:
    types: [label]
  workflow_dispatch:  # 手动触发(验证用)

concurrency:
  group: auction-label
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # His 域名对 GitHub 出口 IP 被风控(2026-08-29 起 limit_pool/market_breadth 断供),
      # His 调用改走 SCF 中转(见 src/config.py KPL_HIS_PROXY); 本地不设此变量保持直连
      KPL_HIS_PROXY: https://1258166434-kgwxvgeu2h.ap-guangzhou.tencentscf.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # auction.db 恢复(Release 迁移): 写库前必恢复; Release 内部自带日快照回退, 失败即终止
      - name: 下载 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          else
            echo "❌ auction.db 恢复失败, 终止防数据断链"; exit 1
          fi
          sha256sum data/auction.db | awk '{print $1}' > /tmp/auction_sha_start

      # 2026-09-09 加固: 原单日 + continue-on-error → His 未定稿时静默 0 行、次日不回头
      # (09-07/08 漏补事故)。改 7 天滚动窗口(幂等 INSERT OR REPLACE 自愈) + --strict(末尾日
      # 0 条且窗口内其它日有数据 → 失败可见); 去掉 continue-on-error 让断档暴露。
      - name: 涨停池全字段落库(7 天滚动自愈, 周期引擎数据源)
        if: success()
        run: cd jiarenmens && python scripts/backfill_emotion.py --pool $(TZ=Asia/Shanghai date -d '7 days ago' +%F) $(TZ=Asia/Shanghai date +%F) --strict

      # auction.db 上传闸门(Release 迁移): sha 变更才传; 失败即失败不吞
      - name: 上传 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          NOW=$(sha256sum data/auction.db | awk '{print $1}')
          if [ "$NOW" = "$(cat /tmp/auction_sha_start)" ]; then
            echo "auction.db 无变更, 跳过上传"
          else
            python3 scripts/release_db.py --what auction --upload-latest
          fi

      # auction.db 不再进 git(Release auction-state, 上方上传步骤已落库), 无需提交步骤


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [label]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
