name: 竞价结果标签
# 收盘后(约 15:05, cron-job.org repository_dispatch / workflow_dispatch)触发。
# 把当日竞价选股(auction.db candidates)关联实际收盘表现, 写入 candidate_results, 积累回测样本。

on:
  repository_dispatch:
    types: [label]
  workflow_dispatch:  # 手动触发(验证用)

concurrency:
  group: auction-label
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # His 域名对 GitHub 出口 IP 被风控(2026-08-29 起 limit_pool/market_breadth 断供),
      # His 调用改走 SCF 中转(见 src/config.py KPL_HIS_PROXY); 本地不设此变量保持直连
      KPL_HIS_PROXY: https://1258166434-kgwxvgeu2h.ap-guangzhou.tencentscf.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # auction.db 恢复(Release 迁移): 打标写库前必恢复; Release 失败回退日期快照→git 内库过渡
      - name: 下载 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          elif [ -f data/auction.db ]; then
            echo "⚠️ auction 热层不可用(迁移过渡期), 使用 git 内 db 继续"
          else
            echo "❌ auction.db 恢复失败且本地无库, 终止防数据断链"; exit 1
          fi
          sha256sum data/auction.db | awk '{print $1}' > /tmp/auction_sha_start

      - name: 结果标签(今日选股 → 收盘表现)
        run: cd jiarenmens && python scripts/auction_scan.py --label $(TZ=Asia/Shanghai date +%F)

      - name: 涨停池全字段落库(周期引擎数据源, 修复当日断档)
        if: success()
        continue-on-error: true
        run: cd jiarenmens && python scripts/backfill_emotion.py --pool $(TZ=Asia/Shanghai date +%F) $(TZ=Asia/Shanghai date +%F)

      # auction.db 上传闸门(Release 迁移): sha 变更才传; 标签结果不可重算, 失败即失败不吞
      - name: 上传 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          NOW=$(sha256sum data/auction.db | awk '{print $1}')
          if [ "$NOW" = "$(cat /tmp/auction_sha_start)" ]; then
            echo "auction.db 无变更, 跳过上传"
          else
            python3 scripts/release_db.py --what auction --upload-latest
          fi

      - name: 提交 auction.db(候选 + 结果标签)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f jiarenmens/data/auction.db
          if git diff --staged --quiet; then
            echo "auction.db 无变化, 跳过提交"
          else
            git commit -m "🎯 竞价结果标签 $(TZ=Asia/Shanghai date +%F) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "✅ 推送成功"
                exit 0
              fi
              echo "⚠️ 推送失败, 重试 $i/3..."
              sleep 5
            done
            echo "❌ 推送失败"; exit 1
          fi
