name: KPL 连通性探针(His 直连 vs SCF 中转)

# 背景(2026-09-09): GitHub Actions 出口连 SCF 中转超时(ConnectTimeout 10s), 而本地两条路都通。
# 本探针从 CI 侧分别测试 直连 apphis / 经 SCF 中转, 输出 HTTP 码与耗时, 用于决定回补走哪条路。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kpl-connectivity-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 直连 apphis(8s 超时)
        id: direct
        run: |
          URL='https://apphis.longhuvip.com/w1/api/index.php?a=DailyLimitPerformance&c=HisHomeDingPan&Day=2026-06-30&PidType=1&Type=4&Index=0&Order=0&st=500'
          code=$(curl -s -o /tmp/direct.json -w "%{http_code}" --max-time 8 "$URL"); rc=$?
          echo "直连 HTTP ${code}(curl exit ${rc})"
          head -c 160 /tmp/direct.json 2>/dev/null; echo
          # 原来写 `|| echo FAILED` 让探测失败也保持绿灯 — 那样"job 绿"什么都说明不了
          if [ "$code" = "200" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: 经 SCF 中转(8s 超时)
        id: proxy
        run: |
          URL='https://1258166434-kgwxvgeu2h.ap-guangzhou.tencentscf.com/kpl-his?a=DailyLimitPerformance&c=HisHomeDingPan&Day=2026-06-30&PidType=1&Type=4&Index=0&Order=0&st=500'
          code=$(curl -s -o /tmp/proxy.json -w "%{http_code}" --max-time 8 "$URL"); rc=$?
          echo "中转 HTTP ${code}(curl exit ${rc})"
          head -c 160 /tmp/proxy.json 2>/dev/null; echo
          if [ "$code" = "200" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: 通道汇总
        run: |
          echo "直连通: ${{ steps.direct.outputs.ok == '1' }} / 中转通: ${{ steps.proxy.outputs.ok == '1' }}"
          if [ "${{ steps.direct.outputs.ok }}" != "1" ] && [ "${{ steps.proxy.outputs.ok }}" != "1" ]; then
            echo "❌ 直连与 SCF 中转均不可用 ⇒ KPL His 数据链路中断(回补/涨停池会断供)"; exit 1
          fi
          echo "✅ 至少一条通道可用(哪条可用以上面 HTTP 码为准)"
      - name: 经 Cloudflare Worker(备用通道)
        run: |
          if [ -z "${{ secrets.CF_WORKER_URL }}" ]; then echo "worker 备用通道未配置(如实记录, 不做探测)"; else
            code=$(curl -s -o /tmp/worker.json -w "%{http_code}" --max-time 8 "${{ secrets.CF_WORKER_URL }}"); echo "worker HTTP ${code}"; head -c 160 /tmp/worker.json; echo
          fi


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
