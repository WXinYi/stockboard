name: 代码门禁(单测 + 语法)

# 独立护栏: 只在代码提交/PR 触发, 不挂在 75+ runs/日 的数据班上, 不拖慢采集。
# 数据班提交走 [skip ci] 且只改 public/data、jiarenmens/data, 不匹配下方 paths。
on:
  push:
    branches: [main]
    paths:
      - 'jiarenmens/**/*.py'
      - 'stockboard-app/src/**'
      - 'stockboard-app/package.json'
      - 'stockboard-app/package-lock.json'
      - 'stockboard-app/vite.config.js'
      - 'scf/**'
      - '.github/workflows/*.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'jiarenmens/**/*.py'
      - 'stockboard-app/src/**'
      - 'stockboard-app/package.json'
      - 'stockboard-app/package-lock.json'
      - 'stockboard-app/vite.config.js'
      - 'scf/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: stockboard-app/package-lock.json

      - name: SCF 代理单测
        # Node 20 的 --test 会把文件之后的位置参数当成测试文件；reporter 参数一律不放。
        run: node --test scf/index.test.cjs

      # 前端门禁(2026-11-17 复核 P0-2): 此前 paths 覆盖 src 却从不跑 vitest,
      # 200+ 用例在 CI 零拦截; 这里补上, 与 scf/后端同级门禁。
      - name: 前端依赖安装
        working-directory: stockboard-app
        run: npm ci --no-audit --no-fund

      - name: 前端单测(vitest)
        working-directory: stockboard-app
        run: npx vitest run

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # src/utils/visibility.py 用了 dict | None, 需 3.10+
          cache: 'pip'

      # 只装测试实际需要的最小依赖; playwright 是手动浏览器探测脚本用的重依赖,
      # 已在 test_api_requests.py 中延迟导入, 门禁无需安装。
      - name: 安装最小依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 语法检查
        run: python -m compileall -q jiarenmens/src jiarenmens/scripts

      - name: 单元测试
        working-directory: jiarenmens
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: 失败摘要
        if: failure()
        # 块标量避免单行 echo 中 ": " 被严格 YAML 解析成映射值
        run: |
          echo "::error::单测或语法检查未通过, 请勿合入"
          echo "本地复现(后端): cd jiarenmens && python -m unittest discover -s scripts -p 'test_*.py'"
          echo "本地复现(前端): cd stockboard-app && npm ci && npx vitest run"
          echo "本地复现(scf):  node --test scf/index.test.cjs"
