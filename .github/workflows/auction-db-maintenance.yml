name: auction-db 维护(幽灵日期清理)
# 手动维护工具: 清理 auction.db 中指定日期的幽灵行(假日回放数据), 清完按 sha 门上传热层。
# 背景(2026-09-27): 09-25(中秋) 两个无守卫 workflow 把假日回放写进库(详见
# scripts/purge_auction_date.py 头注); 防复发守卫已同批上线, 本 workflow 负责存量清理。
# 用法: 手动 dispatch, date=目标日期, apply=true 才真删(默认 dry-run 看命中量)。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '要清理的日期 YYYY-MM-DD'
        required: true
        default: '2026-09-25'
      apply:
        description: 'true=实际删除并上传热层, false=dry-run'
        type: boolean
        default: false

concurrency:
  group: auction-maintenance
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 下载 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          else
            echo "❌ auction.db 恢复失败, 终止"; exit 1
          fi
          sha256sum data/auction.db | awk '{print $1}' > /tmp/auction_sha_start

      - name: 清理幽灵日期
        run: |
          cd jiarenmens
          ARGS="--date ${{ inputs.date }}"
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          python3 scripts/purge_auction_date.py $ARGS

      - name: 上传 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          NOW=$(sha256sum data/auction.db | awk '{print $1}')
          if [ "$NOW" = "$(cat /tmp/auction_sha_start)" ]; then
            echo "auction.db 无变更, 跳过上传"
          else
            python3 scripts/release_db.py --what auction --upload-latest --baseline-sha-file /tmp/auction_sha_start
          fi
