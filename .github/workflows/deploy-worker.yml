# KPL 中转 Worker 自动部署 — push worker/ 目录时部署到 Cloudflare Workers
# 需要仓库 secrets: CF_API_TOKEN(Edit Cloudflare Workers 模板) + CF_ACCOUNT_ID
name: deploy-worker

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Deploy KPL proxy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
          workingDirectory: worker


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
