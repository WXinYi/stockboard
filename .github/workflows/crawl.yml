name: 数据采集 + 部署
# 由 cron-job.org 通过 repository_dispatch / workflow_dispatch 触发，不用 GitHub schedule。
#
# S2 / Commit-R1 起：
#   选手数据 → player_snapshot.py --rank/--midday/--close（AQ5=A 直取榜单 userid）
#   市场数据 → export_market.py --market-only（4 切片平铺，AQ1=A 路径零改动）
#   不再跑 main.py / export_json.py / notify_daily.py / prune_crawl_db.py
#
# 班次（单一真源，见「班次判定」step）：
#   crawl-eod          → close   （15:15 专班，必做 >=1500 定稿）
#   0925–0929          → rank    （09:26 首班，容忍窗吸收外部 job 漂移）
#   1129–1134          → midday
#   其它               → market
# player_ok = class != market && event != push && vars.SB_DATA_V2 != '0'
# → SB_DATA_V2=0 时选手新 4 JSON 一律不产出（A3：新 schema 不得早于 P3/S4 原子切换）。
#   push 触发一律只跑 market，防代码 push 撞 09:26 触发第二次 75 次榜单。

on:
  repository_dispatch:
    types: [crawl, crawl-eod]
  workflow_dispatch:
    # 盘后补数 / S5 验收：显式覆盖班次（不影响定时 job，它们仍走北京时间判定）
    inputs:
      force_class:
        description: '手动覆盖班次（auto = 按北京时间判定）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - rank
          - midday
          - close
          - market
  push:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-24.04
    # GitHub 默认 job 超时 360 分钟；盘后 --close 串行 4002 次请求曾挂起 46 分钟被人工取消。
    # 历史最长真实班次 24.4 分钟(EOD 专班) → 60 分钟留约 2.5x 余量，挂死自动止损且会触发 alert-on-failure。
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: jiarenmens/requirements.txt

      - name: 安装依赖
        run: pip install requests aiohttp

      # 交易日守卫(2026-09-21): 非交易日(周末/法定节假日)跳过全部采集/导出/上传/提交路径,
      # 只保留构建部署。日历解析前端 tradingCalendar.js 单一数据源, 正则与
      # watchdog.parse_holidays 同款(改动两处同步); 未覆盖年份退回周一~五近似。
      # push 触发仅在 09:00-15:15 采集(盘后数据不变, 只做纯发版)。
      # 守卫自身失败按交易日放行(fail-open, 保持原行为)。
      - name: 交易日守卫
        id: dayguard
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          try:
              now = datetime.now(ZoneInfo("Asia/Shanghai"))
              js = Path("stockboard-app/src/utils/tradingCalendar.js").read_text(encoding="utf-8")
              hol = {}
              for m in re.finditer(r"const\s+HOLIDAYS_(\d{4})\s*=\s*new Set\(\[([^\]]*)\]", js):
                  hol[int(m.group(1))] = set(re.findall(r"'(\d{4}-\d{2}-\d{2})'", m.group(2)))
              trading_day = now.weekday() < 5 and now.strftime("%Y-%m-%d") not in hol.get(now.year, ())
              if os.environ.get("GITHUB_EVENT_NAME") == "push":
                  trading = trading_day and "0900" <= now.strftime("%H%M") <= "1515"
              else:
                  trading = trading_day   # dispatch/crawl-eod 班保持原行为(不按时段收窄)
              verdict = "采集+部署" if trading else "仅部署(跳过采集)"
              print(f"📅 交易日历年份: {sorted(hol) or '无'} | 北京 {now:%Y-%m-%d %H:%M} → {verdict}")
          except Exception as e:
              print(f"⚠️ 交易日历/时钟解析失败({e}), 按交易日放行(保持原行为)")
              trading = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"trading={'true' if trading else 'false'}\n")
          PY

      - name: 班次判定(单一真源)
        id: shift
        env:
          FORCE_CLASS: ${{ inputs.force_class || 'auto' }}
        run: |
          HHMM=$(TZ=Asia/Shanghai date +%H%M)
          H=$((10#$HHMM))
          ACTION="${{ github.event.action }}"
          EVENT="${{ github.event_name }}"
          if [ "$FORCE_CLASS" != "auto" ]; then
            CLASS="$FORCE_CLASS"   # workflow_dispatch -f force_class=rank|midday|close
          elif [ "$ACTION" = "crawl-eod" ]; then
            CLASS=close
          elif [ "$H" -ge 925 ] && [ "$H" -le 929 ]; then
            CLASS=rank
          elif [ "$H" -ge 1129 ] && [ "$H" -le 1134 ]; then
            CLASS=midday
          else
            CLASS=market
          fi
          PLAYER_OK=false
          if [ "$CLASS" != "market" ] && [ "$EVENT" != "push" ] && [ "${{ vars.SB_DATA_V2 }}" != "0" ]; then
            PLAYER_OK=true
          fi
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "player_ok=$PLAYER_OK" >> "$GITHUB_OUTPUT"
          echo "🕐 北京 $HHMM action=$ACTION event=$EVENT → class=$CLASS player_ok=$PLAYER_OK"

      # auction.db 恢复: 竞价/宽度/炸板多班共写(Release 热层), 每班开跑前必恢复,
      # sha 起点也在此记录(上传闸门用)。F1: release_db.py 保留该链, 删它即断 20 班市场数据。
      - name: 下载 auction.db 热层
        if: steps.dayguard.outputs.trading != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          else
            echo "❌ auction.db 恢复失败, 终止防数据断链"; exit 1
          fi
          sha256sum data/auction.db | awk '{print $1}' > /tmp/auction_sha_start

      # 格局推送搭 crawl 便车: 午盘 13:05 / 尾盘 14:51 各只命中一班(幂等 state 为第二道保障)。
      - name: 午盘格局推送
        if: github.event_name != 'push' && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1300 ] && [ "$H" -le 1314 ]; then
            python scripts/cycle_push.py --session midday
          else
            echo "非午盘时段($H), 跳过"
          fi

      - name: 尾盘格局推送
        if: github.event_name != 'push' && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1448 ] && [ "$H" -le 1455 ]; then
            python scripts/cycle_push.py --session eod
          else
            echo "非尾盘时段($H), 跳过"
          fi

      - name: 人气榜快照
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        run: |
          cd jiarenmens
          python scripts/auction_scan.py --hot-rank 2>&1 | tee /tmp/hotrank.log
          if grep -qE "❌|失败|异常|Traceback" /tmp/hotrank.log; then
            echo "::warning::本班人气榜快照未写入(该日人气榜数据将缺失)"
          fi

      - name: 市场宽度更新
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        env:
          KPL_HIS_PROXY: https://1258166434-kgwxvgeu2h.ap-guangzhou.tencentscf.com
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1500 ]; then
            python scripts/backfill_emotion.py --breadth 2>&1 | tee /tmp/breadth.log
            if grep -qE "跳过本次|失败|Traceback" /tmp/breadth.log; then
              echo "::warning::本班市场宽度未更新 — 断档会让周期引擎的涨停数/破板率分量缺失"
            fi
          else
            echo "盘中班次($H), 跳过宽度更新"
          fi

      - name: 炸板池归档(选股宝)
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1500 ]; then
            python scripts/backfill_broken.py 2>&1 | tee /tmp/broken.log
            if grep -qE "⚠️|失败|Traceback" /tmp/broken.log; then
              echo "::warning::本班炸板池归档有缺口 — 弱转强判定会少数据"
            fi
          else
            echo "盘中班次($H), 跳过炸板归档"
          fi

      - name: 盘中宽度刷新(实时当日行)
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        run: |
          cd jiarenmens
          python scripts/backfill_emotion.py --breadth-rt 2>&1 | tee /tmp/breadthrt.log
          if grep -qE "❌|失败|Traceback" /tmp/breadthrt.log; then
            echo "::warning::本班盘中实时宽度未刷新(周期引擎将用昨日顺延口径)"
          fi

      # ── 选手快照（AQ5=A 硬连线；--rank 与契约哨兵同批）────────────────
      - name: 选手榜单快照(--rank)
        if: steps.shift.outputs.class == 'rank' && steps.shift.outputs.player_ok == 'true'
        env:
          EM_CT_TOKEN: ${{ secrets.EM_CT_TOKEN }}
          EM_UT_TOKEN: ${{ secrets.EM_UT_TOKEN }}
          SB_WRITE_PROD: '1'
        run: cd jiarenmens && python scripts/player_snapshot.py --rank --live --out ../stockboard-app/public/data/latest

      - name: 契约哨兵(EM 直连可用性)
        if: steps.shift.outputs.class == 'rank' && steps.shift.outputs.player_ok == 'true'
        env:
          SB_WRITE_PROD: '1'
        run: cd jiarenmens && python scripts/em_contract_probe.py --live --out ../stockboard-app/public/data/latest

      - name: 选手午盘快照(--midday)
        if: steps.shift.outputs.class == 'midday' && steps.shift.outputs.player_ok == 'true'
        env:
          EM_CT_TOKEN: ${{ secrets.EM_CT_TOKEN }}
          EM_UT_TOKEN: ${{ secrets.EM_UT_TOKEN }}
          SB_WRITE_PROD: '1'
        run: cd jiarenmens && python scripts/player_snapshot.py --midday --live --out ../stockboard-app/public/data/latest

      - name: 选手收盘快照(--close)
        if: steps.shift.outputs.class == 'close' && steps.shift.outputs.player_ok == 'true'
        env:
          EM_CT_TOKEN: ${{ secrets.EM_CT_TOKEN }}
          EM_UT_TOKEN: ${{ secrets.EM_UT_TOKEN }}
          SB_WRITE_PROD: '1'
        run: cd jiarenmens && python scripts/player_snapshot.py --close --live --out ../stockboard-app/public/data/latest

      - name: 市场切片导出(--market-only)
        if: steps.dayguard.outputs.trading != 'false'
        env:
          SB_WRITE_PROD: '1'
        run: cd jiarenmens && python scripts/export_market.py --market-only --out ../stockboard-app/public/data/latest

      # auction.db 上传闸门: sha 变更才传(夜间空转班自动跳过)。竞价档案易逝不可重采, 失败即失败。
      - name: 上传 auction.db 热层
        if: steps.dayguard.outputs.trading != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          NOW=$(sha256sum data/auction.db | awk '{print $1}')
          if [ "$NOW" = "$(cat /tmp/auction_sha_start)" ]; then
            echo "auction.db 无变更, 跳过上传"
          else
            python3 scripts/release_db.py --what auction --upload-latest --baseline-sha-file /tmp/auction_sha_start
          fi

      # dist 壳按代码指纹缓存：数据班(代码未变)恢复缓存后仅 rsync 拼接最新数据。
      - name: 恢复 dist 壳
        id: dist
        uses: actions/cache@v5
        with:
          path: stockboard-app/dist
          key: dist-shell-${{ hashFiles('stockboard-app/src/**', 'stockboard-app/index.html', 'stockboard-app/vite.config.js', 'stockboard-app/package-lock.json') }}

      - name: Setup Node
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stockboard-app/package-lock.json

      - name: Build Vue
        if: steps.dist.outputs.cache-hit != 'true'
        run: cd stockboard-app && npm ci && npm run build

      - name: 拼接最新数据
        if: steps.dist.outputs.cache-hit == 'true'
        run: rsync -a --delete stockboard-app/public/data/ stockboard-app/dist/data/

      - name: 提交数据
        if: steps.dayguard.outputs.trading != 'false'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          # AQ1=A：market 4 切片与 3 个契约均平铺在 latest/，路径零改动；精确 add，不用 -A。
          # SB_DATA_V2=0 时 players/today 尚未产出 → 逐文件判存, 避免 git add 对缺失路径报错打死整班。
          for f in players stocks today hot_rank lianban_bid broken_pool market_breadth; do
            p="stockboard-app/public/data/latest/$f.json"
            if [ -f "$p" ]; then git add -f "$p"; fi
          done
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "📊 数据更新 $(date +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then
                echo "✅ 推送成功"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "⚠️ 推送失败，重试 $i/3..."
              sleep 5
            done
            echo "❌ 推送失败"; exit 1
          fi

      # 格局推送失败在此判红: 推送步骤 continue-on-error 不得阻断落库/部署, 但失败不能无声。
      - name: 格局推送失败检查
        if: always()
        run: |
          if [ -f /tmp/cycle_push_failed ]; then
            echo "❌ 本班格局推送未送达:"; cat /tmp/cycle_push_failed; exit 1
          fi
          echo "✅ 格局推送无失败记录(或本班不在推送窗口)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: stockboard-app/dist

  deploy:
    needs: crawl
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 失败告警: 失败不再表现为"钉钉少一条推送 / 页面仍是上一次采集"。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [crawl, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
