name: 数据采集 + 部署
# 由 cron-job.org 通过 repository_dispatch 触发，不用 GitHub 自带 schedule

on:
  repository_dispatch:
    types: [crawl]
  workflow_dispatch:  # 也允许手动触发
  push:
    branches: [main]

# 确保并发运行不会被互相覆盖
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: jiarenmens/requirements.txt

      - name: 安装依赖
        run: pip install requests aiohttp

      - name: 数据采集
        run: cd jiarenmens && python main.py --checkpoint-reset

      # 东财人气榜快照(每天最多两份: 09:25 auction 已存 am 则此处自动记 pm, 同(date,snap)去重)
      - name: 人气榜快照
        if: success()
        continue-on-error: true
        run: cd jiarenmens && python scripts/auction_scan.py --hot-rank

      - name: 导出 JSON
        run: cd jiarenmens && python scripts/export_json.py --out ../stockboard-app/public/data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stockboard-app/package-lock.json

      - name: Build Vue
        run: cd stockboard-app && npm ci && npm run build

      # 钉钉通知放在「提交数据」之前：notify_daily.py 会写 last_notify_state.json，
      # 让状态文件跟随当次「提交数据」一起 commit 持久化，供下次对比"新增操作"
      - name: 钉钉通知
        if: success()
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python3 scripts/notify_daily.py

      - name: 提交数据
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f stockboard-app/public/data/ jiarenmens/data/
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "📊 数据更新 $(date +%Y-%m-%d) [skip ci]"
            # 先拉取再推送，避免冲突；失败重试 3 次
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "✅ 推送成功"
                exit 0
              fi
              echo "⚠️ 推送失败，重试 $i/3..."
              sleep 5
            done
            echo "❌ 推送失败"; exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stockboard-app/dist

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
