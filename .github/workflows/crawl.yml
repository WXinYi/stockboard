name: 数据采集 + 部署
# 由 cron-job.org 通过 workflow_dispatch 触发，不用 GitHub 自带 schedule。
# 首班 09:26（与竞价快报同批）、末班 14:51、收盘专班 15:15。
# 首班原为 09:30，2026-09-09 用户反馈"钉钉 09:26 推送了但页面还是昨天的数据"后提前到 09:26
# （cron-job.org jobId 8167465，见 docs/DATA_PIPELINE.md 事故④）。

on:
  repository_dispatch:
    # crawl     = 盘中常规班次(cron-job.org 交易日 20 班, 首班 09:26, 末班 14:51)
    # crawl-eod = 收盘班次(专用 cron 15:15 触发), 必做 Release sync;
    #             未配置该 cron 时由下方 ≥14:45 时间闸门兜底(末班车也能落盘)
    types: [crawl, crawl-eod]
  workflow_dispatch:  # 也允许手动触发
  push:
    branches: [main]

# 确保并发运行不会被互相覆盖
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: jiarenmens/requirements.txt

      - name: 安装依赖
        run: pip install requests aiohttp

      # 交易日守卫(2026-09-21): 非交易日(周末/法定节假日)跳过全部采集/导出/上传/提交路径,
      # 只保留构建部署 —— 周末/节假日 push 代码仍可发版, 但不再产出幽灵数据桶(09-20 周日实测:
      # push 班把周日持仓写进库, 抄作业页"昨天"标签指向非交易日)。日历解析前端
      # tradingCalendar.js 单一数据源, 正则与 watchdog.parse_holidays 同款(改动两处同步);
      # 日历未覆盖年份退回周一~五近似(A股周末永不交易, 与交易所口径一致)。
      # 2026-09-22 延伸: ① 时钟改北京时间(runner 是 UTC, 北京 00:00~08:00 的 push 会判错日期);
      # ② push 触发仅在 09:00-15:15 采集 —— 盘后/夜间数据不变, 只做纯发版(09-21 实测夜间
      # push 班被盘后慢接口拖 45min+, 白烧机时); dispatch/crawl-eod 班保持原行为不受影响。
      # 守卫自身失败按交易日放行(fail-open, 保持原行为), 不新增失败面。
      - name: 交易日守卫
        id: dayguard
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          try:
              now = datetime.now(ZoneInfo("Asia/Shanghai"))
              js = Path("stockboard-app/src/utils/tradingCalendar.js").read_text(encoding="utf-8")
              hol = {}
              for m in re.finditer(r"const\s+HOLIDAYS_(\d{4})\s*=\s*new Set\(\[([^\]]*)\]", js):
                  hol[int(m.group(1))] = set(re.findall(r"'(\d{4}-\d{2}-\d{2})'", m.group(2)))
              trading_day = now.weekday() < 5 and now.strftime("%Y-%m-%d") not in hol.get(now.year, ())
              if os.environ.get("GITHUB_EVENT_NAME") == "push":
                  trading = trading_day and "0900" <= now.strftime("%H%M") <= "1515"
              else:
                  trading = trading_day   # dispatch/crawl-eod 班保持原行为(不按时段收窄)
              verdict = "采集+部署" if trading else "仅部署(跳过采集)"
              print(f"📅 交易日历年份: {sorted(hol) or '无'} | 北京 {now:%Y-%m-%d %H:%M} → {verdict}")
          except Exception as e:
              print(f"⚠️ 交易日历/时钟解析失败({e}), 按交易日放行(保持原行为)")
              trading = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"trading={'true' if trading else 'false'}\n")
          PY

      # auction.db 恢复: 竞价/宽度/炸板/六情绪多班共写(Release 三层迁移), 每班开跑前必恢复,
      # sha 起点也在此记录(上传闸门用)。Release 内部自带日快照回退, 失败即终止
      # (2026-09-14 删"git 内库兜底"分支: 批次2后 checkout 已无库, 该分支不可达)。
      - name: 下载 auction.db 热层
        if: steps.dayguard.outputs.trading != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          else
            echo "❌ auction.db 恢复失败, 终止防数据断链"; exit 1
          fi
          sha256sum data/auction.db | awk '{print $1}' > /tmp/auction_sha_start

      # 格局推送搭 crawl 便车(每日12次 dispatch), 时间窗各只触发一次:
      # 午盘=13:05 那次 / 尾盘=14:40 那次; push 触发不推
      - name: 午盘格局推送
        if: github.event_name == 'repository_dispatch' && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1300 ] && [ "$H" -le 1320 ]; then
            python scripts/cycle_push.py --session midday
          else
            echo "非午盘时段($H), 跳过"
          fi

      - name: 尾盘格局推送
        if: github.event_name == 'repository_dispatch' && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1430 ] && [ "$H" -le 1455 ]; then
            python scripts/cycle_push.py --session eod
          else
            echo "非尾盘时段($H), 跳过"
          fi

      # 每次 run 都从 Release 热层恢复 db(白天 run 也需要完整 40 日历史: export_json 的
      # 持仓变动/卖出预警/高手判定都依赖历史采集日; 空库导出会产出退化数据并污染页面)。
      # 白天 run 恢复后只读不传; 上传由下方步骤的收盘闸门控制。
      # ④降级链前置: 恢复 actions/cache 里的库副本(与 Release 独立的容错来源;
      # 精确 key 永不命中, 靠 restore-keys 前缀取最近一份)
      - name: 恢复库副本缓存(降级兜底)
        if: steps.dayguard.outputs.trading != 'false'
        uses: actions/cache/restore@v4
        with:
          path: jiarenmens/data/.cache-db/
          key: crawl-db-not-exist-${{ github.run_id }}
          restore-keys: |
            crawl-db-

      - name: 下载热层库(含④三级降级链)
        if: steps.dayguard.outputs.trading != 'false'
        env:
          # 必须带 token: 缺了会走匿名 API(60 次/小时/IP), 被限流时 get_release 返回 None,
          # 脚本静默 exit 1 → 整班 skipped(2026-09-09 09:30 首班就是这么挂的)。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          # ④降级链(2026-09-13 拍板): 热层 → 温层最新周快照 → cache 副本;
          # 非 hot 来源过库龄闸门(≤4 天)并写 data/.db_restore_source, 降级必发钉钉告警。
          if python3 scripts/release_db.py --download-fallback --cache-db data/.cache-db/crawl_data.db.gz; then
            echo "✅ 库恢复成功(见上方来源日志)"
          else
            echo "❌ ④三级降级链耗尽(热层/温层/缓存副本全不可用), 终止以防数据断链"; exit 1
          fi
          if grep -q '"degraded": true' data/.db_restore_source 2>/dev/null; then
            echo "⚠️ 本班为降级库, 发钉钉告警"
            python3 - <<'PY'
          import json
          from src.notify.dingtalk import DingTalk
          m = json.load(open('data/.db_restore_source'))
          DingTalk().send_markdown(
              'StockBoard 降级库告警',
              f"⚠️ **本班热层下载失败, 已降级采集**\n\n"
              f"- 来源: {m.get('source')}\n"
              f"- 库龄: {m.get('stale_days', '?')} 天(闸门≤4天通过)\n\n"
              f"数据带降级标记(core.json.db_restore), 基线可能偏旧, 变化类数字以钉钉实盘推送为准。")
          PY
          fi

      - name: 数据采集
        if: steps.dayguard.outputs.trading != 'false'
        run: cd jiarenmens && python main.py --checkpoint-reset

      # 东财人气榜快照(每天最多两份: 09:25 auction 已存 am 则此处自动记 pm, 同(date,snap)去重)
      # 三个 continue-on-error 步骤的可见化(2026-09-15 静默审计): 它们不能判红(人气/宽度/炸板
      # 失败不该阻断落库与部署), 但失败必须留下可检索的 ::warning:: 注解, 而不是只有日志里一行。
      - name: 人气榜快照
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        run: |
          cd jiarenmens
          python scripts/auction_scan.py --hot-rank 2>&1 | tee /tmp/hotrank.log
          if grep -qE "❌|失败|异常|Traceback" /tmp/hotrank.log; then
            echo "::warning::本班人气榜快照未写入(该日人气榜数据将缺失)"
          fi

      # 市场宽度(涨停/跌停/炸板率)每日落库: 仅收盘班次(≥15:00)写, 盘中班次跳过
      # 防止盘中写进半日数; 断档会使周期引擎用旧宽度误判阶段(9/4 曾误判"分歧")
      - name: 市场宽度更新
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        env:
          # His 域名对 Actions 出口 IP 风控(08-29 起), 走 SCF 中转(同 auction-label.yml)
          KPL_HIS_PROXY: https://1258166434-kgwxvgeu2h.ap-guangzhou.tencentscf.com
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1500 ]; then
            python scripts/backfill_emotion.py --breadth 2>&1 | tee /tmp/breadth.log
            if grep -qE "跳过本次|失败|Traceback" /tmp/breadth.log; then
              echo "::warning::本班市场宽度未更新 — 断档会让周期引擎的涨停数/破板率分量缺失(9/4 误判同族)"
            fi
          else
            echo "盘中班次($H), 跳过宽度更新"
          fi

      # 炸板池归档(选股宝源): 收盘班写"最近 7 个交易日"滚动窗口(幂等, 见 backfill_broken.py)。
      # 当日炸板池收盘后未定稿时源返回空 data, 该日由次日窗口自动补上; 末尾日无数据时脚本
      # 自带 3×60s 重试等定稿。只有"落后超一个交易日"(自愈失效)才打 ⚠️ → 下面守卫翻成注解。
      # 2026-09-17 加固前是"只取 limit_pool 最大值的单日" + 0 行当成功 → 09-07/08、09-14~09-16
      # 共 5 天静默缺口(与 09-09 limit_pool 漏补同族, 见 docs/DATA_PIPELINE.md §3.4)。
      - name: 炸板池归档(选股宝)
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        run: |
          cd jiarenmens
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1500 ]; then
            python scripts/backfill_broken.py 2>&1 | tee /tmp/broken.log
            if grep -qE "⚠️|失败|Traceback" /tmp/broken.log; then
              echo "::warning::本班炸板池归档有缺口(部分日期失败或自愈失效) — 弱转强判定会少数据"
            fi
          else
            echo "盘中班次($H), 跳过炸板归档"
          fi

      # 盘中实时宽度(2026-09-18): 只拉当日行 upsert 秒级完成, 让盘中周期/六情绪判定
      # 用今日实时口径而非昨日顺延(今日行 captured_at 标记采样时刻; 15:15 专班的
      # 市场宽度更新会用收盘定稿覆盖为 NULL)。失败不阻断采集, warning 可见。
      - name: 盘中宽度刷新(实时当日行)
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        run: |
          cd jiarenmens
          python scripts/backfill_emotion.py --breadth-rt 2>&1 | tee /tmp/breadthrt.log
          if grep -qE "❌|失败|Traceback" /tmp/breadthrt.log; then
            echo "::warning::本班盘中实时宽度未刷新(周期引擎将用昨日顺延口径)"
          fi

      - name: 导出 JSON
        if: steps.dayguard.outputs.trading != 'false'
        run: cd jiarenmens && python scripts/export_json.py --out ../stockboard-app/public/data

      # auction.db 上传闸门: sha 变更才传(夜间空转班自动跳过)。竞价档案易逝不可重采,
      # 失败即让 run 失败(同 crawl_data 的"宁可停, 不可断链"), 不吞错。
      - name: 上传 auction.db 热层
        if: steps.dayguard.outputs.trading != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          NOW=$(sha256sum data/auction.db | awk '{print $1}')
          if [ "$NOW" = "$(cat /tmp/auction_sha_start)" ]; then
            echo "auction.db 无变更, 跳过上传"
          else
            python3 scripts/release_db.py --what auction --upload-latest
          fi

      # dist 壳按代码指纹缓存：数据班(代码未变)恢复缓存后仅 rsync 拼接最新数据，
      # 跳过 npm ci + vite 全量构建(实测慢班 Build Vue 可达 7 分钟，占整班一半)；
      # 代码 push 后第一班 cache miss 自动回退全量构建并重建缓存
      - name: 恢复 dist 壳
        id: dist
        uses: actions/cache@v4
        with:
          path: stockboard-app/dist
          key: dist-shell-${{ hashFiles('stockboard-app/src/**', 'stockboard-app/index.html', 'stockboard-app/vite.config.js', 'stockboard-app/package-lock.json') }}

      - name: Setup Node
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stockboard-app/package-lock.json

      - name: Build Vue
        if: steps.dist.outputs.cache-hit != 'true'
        run: cd stockboard-app && npm ci && npm run build

      # --delete 与 export_json 的"清理跌榜选手旧 JSON"语义一致，不残留已淘汰选手文件
      - name: 拼接最新数据
        if: steps.dist.outputs.cache-hit == 'true'
        run: rsync -a --delete stockboard-app/public/data/ stockboard-app/dist/data/

      # 盯盘共享状态(由 watchdog.yml 每 5 分钟写入): 日报读它跳过已实时推送的操作,
      # 读不到(文件不存在)= watchdog 失灵 → 日报自动全量兜底。只读不写, 保存归 watchdog。
      - name: 恢复盯盘状态(日报去重)
        if: success() && steps.dayguard.outputs.trading != 'false'
        uses: actions/cache/restore@v4
        with:
          path: jiarenmens/data/.watchdog_state.json
          key: watchdog-state-notexist-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      # 钉钉通知放在「提交数据」之前：notify_daily.py 会写 last_notify_state.json，
      # 让状态文件跟随当次「提交数据」一起 commit 持久化，供下次对比"新增操作"
      - name: 钉钉通知
        if: success() && steps.dayguard.outputs.trading != 'false'
        continue-on-error: true
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python3 scripts/notify_daily.py

      # 保留窗口外采集日删除+VACUUM, 封顶 crawl_data.db 体积(不清理则每天 +2~3MB 无限增长)
      - name: 清理过期采集数据
        if: steps.dayguard.outputs.trading != 'false'
        run: cd jiarenmens && python3 scripts/prune_crawl_db.py --apply

      # 收盘 run: 快照→热层覆盖 + 当周→温层 + 已完成月→冷层 + 温层滚动清理。
      # 触发条件(满足其一): ①专用收盘班次 crawl-eod(cron 15:15, 盘后真收盘数据);
      # ②时间闸门 ≥14:45 兜底——cron 末班 14:51 触发的 run 也能落盘。
      # 上传失败立即终止并告警——宁可停, 不可断链。
      # ⚠️ 闸门必须早于 cron 末班(14:51): 08-31 曾因闸门 15:10 高于末班车,
      # 当天 db 数据未持久化而丢失(页面 JSON 不受影响, 但 40 日窗口缺一天)。
      - name: 上传 Release 存储(热/温/冷层)
        if: success() && steps.dayguard.outputs.trading != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.action }}" = "crawl-eod" ]; then
            echo "收盘专班(crawl-eod): 必做 sync"
          elif [ "$(TZ=Asia/Shanghai date +%H%M)" -lt 1445 ]; then
            echo "收盘前 run: 跳过上传"; exit 0
          fi
          cd jiarenmens && python3 scripts/release_db.py --sync

      - name: 提交数据
        if: steps.dayguard.outputs.trading != 'false'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f stockboard-app/public/data/
          git add jiarenmens/data/
          # crawl_data.db / auction.db 已迁 Release 存储(db-state* / auction-state), git 不再跟踪:
          # 二进制快照进 git 是仓库膨胀主因(.git 曾 721MB), 历史取数改用 scripts/fetch_db.py。
          # auction.db 每班由下载/上传步骤走 Release(sha 门), 上传断链即 run 失败可见。
          # 白天不持久化 crawl_data.db 也安全: trades/positions 按 (zh_id,crawl_date) 先删后写,
          # 收盘 run 会全量重采当日数据(经热层恢复后增量入库)。
          git reset -q jiarenmens/data/crawl_data.db 2>/dev/null || true
          git reset -q jiarenmens/data/auction.db 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "📊 数据更新 $(date +%Y-%m-%d) [skip ci]"
            # 先拉取再推送，避免冲突；失败重试 3 次
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "✅ 推送成功"
                exit 0
              fi
              echo "⚠️ 推送失败，重试 $i/3..."
              sleep 5
            done
            echo "❌ 推送失败"; exit 1
          fi

      # ④降级链备份: 把本班(成功且基线合格)的库打包存入 actions/cache, 供下个班热层失败时降级沿用。
      # restore-keys 按"最近创建"取用; cache 与 Release 独立, Release 限流时它仍可用。
      - name: 打包库副本(降级兜底)
        if: success() && steps.dayguard.outputs.trading != 'false'
        run: cd jiarenmens && mkdir -p data/.cache-db && gzip -c data/crawl_data.db > data/.cache-db/crawl_data.db.gz
      - name: 保存库副本缓存(降级兜底)
        if: success() && steps.dayguard.outputs.trading != 'false'
        uses: actions/cache/save@v4
        with:
          path: jiarenmens/data/.cache-db/
          key: crawl-db-${{ github.run_id }}-${{ github.run_attempt }}

      # 格局推送失败在此判红(2026-09-15 静默审计 W3): 推送步骤必须 continue-on-error
      # (推送故障不得阻断落库/部署), 但失败不能无声 —— cycle_push.py 失败时写下标志文件,
      # 到这里(数据步骤全部完成后)才把失败翻成 job 失败, 触发 failure 告警。
      - name: 格局推送失败检查
        if: always()
        run: |
          if [ -f /tmp/cycle_push_failed ]; then
            echo "❌ 本班格局推送未送达:"; cat /tmp/cycle_push_failed; exit 1
          fi
          echo "✅ 格局推送无失败记录(或本班不在推送窗口)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stockboard-app/dist

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [crawl, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
