name: 尾盘格局推送
# 收盘前(约 14:45, cron-job.org repository_dispatch / workflow_dispatch)触发。
# 实时涨停池(涨停时间/封单) + 实时涨跌炸板 → 周期引擎当日口径
# → 钉钉: 周期阶段 / 梯队晋级 / 龙头谱系 / 高位梯队时间线 / 尾盘纪律 / 明日竞价观察名单。

on:
  repository_dispatch:
    types: [cycle-eod]
  workflow_dispatch:  # 手动触发(验证用)

concurrency:
  group: cycle-eod
  cancel-in-progress: true

jobs:
  eod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # auction.db 恢复(Release 迁移): cycle_push 只读周期引擎数据, 恢复失败可降级但需可见
      - name: 下载 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          else
            # 文案与行为对齐(2026-09-15 静默审计 W9): 这里确实是终止本班(不做降级推送),
            # 原文案"推送将降级"与实际 exit 1 不符, 会让人以为还有一条降级推送发出去了。
            echo "❌ auction.db 恢复失败: 本班尾盘推送终止(不做降级推送), 失败由 alert job 告警"; exit 1
          fi

      - name: 尾盘格局推送
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python scripts/cycle_push.py --session eod


  # 失败告警(2026-09-15 静默审计补链): 此前 9 个 workflow 没有任何 if: failure() 步骤,
  # 失败只表现为"钉钉少一条推送 / 页面仍是上一次采集", 无法第一时间知晓。
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [eod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
