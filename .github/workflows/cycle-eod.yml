name: 尾盘格局推送
# 收盘前(约 14:45, cron-job.org repository_dispatch / workflow_dispatch)触发。
# 实时涨停池(涨停时间/封单) + 实时涨跌炸板 → 周期引擎当日口径
# → 钉钉: 周期阶段 / 梯队晋级 / 龙头谱系 / 高位梯队时间线 / 尾盘纪律 / 明日竞价观察名单。

on:
  repository_dispatch:
    types: [cycle-eod]
  workflow_dispatch:  # 手动触发(验证用)

concurrency:
  group: cycle-eod
  cancel-in-progress: true

jobs:
  eod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # auction.db 恢复(Release 迁移): cycle_push 只读周期引擎数据, 恢复失败可降级但需可见
      - name: 下载 auction.db 热层
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd jiarenmens
          if python3 scripts/release_db.py --what auction --download-latest; then
            echo "✅ 已恢复 auction 热层"
          elif [ -f data/auction.db ]; then
            echo "⚠️ auction 热层不可用(迁移过渡期), 使用 git 内 db 继续"
          else
            echo "❌ auction.db 恢复失败且本地无库, 推送将降级"; exit 1
          fi

      - name: 尾盘格局推送
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: cd jiarenmens && python scripts/cycle_push.py --session eod
