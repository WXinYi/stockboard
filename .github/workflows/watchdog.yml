name: 关注盯盘 watchdog
# 交易时段每 5 分钟由 cron-job.org 触发(repository_dispatch: watchdog):
# 拉关注选手组合接口 → 当日新操作即时推钉钉。S2 / PRD-Q2=A② 起不再写
# players/{zh}.json、不再部署 Pages —— 页面数据归 crawl.yml 每班统一提交。
#
# 为什么独立于 crawl: 明细接口秒级/人, 全量采集一班要 5-8 分钟, 提频只会互相取消空转。
# 明细只有日粒度(无盘中时间戳) → "即时" = 当日该笔首次出现/成交次数增加的时刻。
#
# 状态(actions/cache 按日滚动, watchdog-state-*): 当日已推集合 + 连续失败计数。
#
# 并发组独立于 crawl 的 pages-main, 两边可同时跑互不取消;
# cancel-in-progress: false —— 宁可排队也不掐班, 掐班会让"已推状态未落缓存"造成重复推送。

on:
  repository_dispatch:
    types: [watchdog, watchdog-open]
  workflow_dispatch:

concurrency:
  group: watchdog-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    environment: github-pages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 恢复盯盘状态(当日已推集合/失败计数)
        uses: actions/cache/restore@v5
        with:
          path: jiarenmens/data/.watchdog_state.json
          key: watchdog-state-notexist-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      - name: 盯盘检测(新操作推钉钉)
        id: run
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          EM_CT_TOKEN: ${{ secrets.EM_CT_TOKEN }}
          EM_UT_TOKEN: ${{ secrets.EM_UT_TOKEN }}
        run: |
          cd jiarenmens
          # watchdog-open = 开盘冲刺(09:30 触发): 50 秒/轮自循环至 09:35, 抢开盘黄金窗口
          if [ "${{ github.event.action }}" = "watchdog-open" ]; then
            python scripts/watchdog.py --open-sprint
          else
            python scripts/watchdog.py
          fi

      # 失败重试语义: 推送失败时脚本不落状态直接非零退出, 下一班自动补推(at-least-once);
      # 因此状态文件只在成功路径存在, hashFiles 空串时跳过保存。
      - name: 保存盯盘状态
        if: always() && hashFiles('jiarenmens/data/.watchdog_state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: jiarenmens/data/.watchdog_state.json
          key: watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}

  # 失败告警(与其它 workflow 同款): 推送失败不再无声
  alert-on-failure:
    name: 失败告警
    if: failure()
    needs: [watchdog]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 钉钉失败告警
        env:
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          cd jiarenmens
          python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '${{ toJSON(needs) }}'
